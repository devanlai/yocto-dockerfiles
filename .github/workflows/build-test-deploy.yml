name: yocto-container build and test
on:
  push:
    branches:
      - master
  pull_request:

  # Allow for manually running
  workflow_dispatch:

  # Run at 00:52 UTC every Saturday
  schedule:
    - cron: '52 0 * * 6'

jobs:
  build-test-deploy:
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro_to_build: [
          alma-8,
          alma-9,
          debian-10,
          debian-11,
          debian-12,
          fedora-39,
          fedora-40,
          opensuse-15.4,
          opensuse-15.5,
          opensuse-15.6,
          ubuntu-18.04,
          ubuntu-20.04,
          ubuntu-22.04,
          ubuntu-24.04
        ]
        targetplatform: [
          linux/amd64,
          linux/arm64
        ]
        runner: [
          ubuntu-latest,
          ubuntu-24.04-arm
        ]
        exclude:
          - runner: ubuntu-latest
            targetplatform: linux/arm64
          - runner: ubuntu-24.04-arm
            targetplatform: linux/amd64
    runs-on: ${{ matrix.runner }}
    env:
      DEFAULT_ARCH: amd64
      DISTRO_TO_BUILD: ${{ matrix.distro_to_build }}
      TARGETPLATFORM: ${{ matrix.targetplatform }}
      REPO: devanlai/yocto
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.targetplatform }}

    steps:
      - uses: actions/checkout@v4

      # Build and test the images
      - name: Run build-and-test.sh
        run: ./build_container.sh

      # Deploy the images
      - name: Deploy
        if: ${{ env.GHCR_PASSWORD != '' }}
        run: ./deploy.sh
